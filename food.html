    <script data-theme-init>(function () {
        try {
            var stored = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored === 'dark' || (!stored && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    })();</script>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="stylesheet" href="css/food.css?v=3">

</head>
<body>

        <div class="container">

                <li><a href="food.html" class="active">🍜 Food</a></li>

                <li><a href="books.html">📚 Books</a></li>
                <li><a href="now.html">⏰ Now</a></li>
            </ul>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                <span class="sun-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"></path>
                    </svg>
                </span>
                <span class="moon-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                        <path d="M20.35 15.4A8.5 8.5 0 1 1 8.6 3.65a7 7 0 1 0 11.75 11.75z"></path>
                    </svg>
                </span>
            </button>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main>
        <section class="section">
            <div class="container">
                <h2 class="section-title">🍜 Food Guide</h2>
                <p class="section-subtitle">Places I love eating at</p>

                <!-- City Tabs -->
                <div class="city-tabs">
                    <button class="city-tab active home-base" data-city="0">🏠 NYC</button>
                </div>

                <!-- Main Category Filter Pills -->
                <div class="category-filters" id="mainCategoryFilters">
                    <button class="category-pill main-category-pill active" data-category="all">All</button>
                </div>

                <!-- Subcategory Filter Pills (shown when main category selected) -->
                <div class="category-filters hidden" id="subcategoryFilters"></div>

                <!-- Stats Bar -->
                <div class="food-stats" id="foodStats"></div>

                <!-- Action Buttons -->
                <div class="food-actions">
                    <button class="action-btn" id="downloadCSV" title="Download as CSV">
                        <span>📊</span> Download CSV
                    </button>
                    <button class="action-btn" id="saveToMaps" title="Save to Google Maps">
                        <span>🗺️</span> Save to Google Maps
                    </button>
                </div>

                <!-- Map Toggle & Container -->
                <div class="map-section">
                    <button class="map-toggle" id="mapToggle">
                        <span>📍</span> Show Map
                    </button>
                    <div class="map-wrapper" id="mapWrapper">
                        <div id="map" class="map-container"></div>
                    </div>
                </div>

                <!-- Restaurant Cards Grid -->
                <div class="personality-grid" id="foodGrid">
                    <p class="loading-message">Loading restaurants...</p>
                </div>
            </div>
        </section>
    </main>

                </div>
                <p>&copy; <span class="js-year"></span> Hans Cho. All rights reserved.</p>

        </div>
