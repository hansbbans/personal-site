                <span class="sun-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"></path>

                </span>
                <span class="moon-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" focusable="false">

                <span></span>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="section-title">Food Guide</h1>
                <p class="section-subtitle">Places I love eating at</p>

                <!-- City Tabs -->
                <div class="city-tabs">
                    <button class="city-tab active home-base" data-city="0">🏠 NYC</button>
                </div>

                <!-- Main Category Filter Pills -->
                <div class="category-filters" id="mainCategoryFilters">
                    <button class="category-pill main-category-pill active" data-category="all">All</button>
                </div>

                <!-- Subcategory Filter Pills (shown when main category selected) -->
                <div class="category-filters hidden" id="subcategoryFilters"></div>

                <!-- Stats Bar -->
                <div class="food-stats" id="foodStats"></div>

                <!-- Action Buttons -->
                <div class="food-actions">
                    <button class="action-btn" id="downloadCSV" title="Download as CSV">
                        <span>📊</span> Download CSV
                    </button>
                    <button class="action-btn" id="saveToMaps" title="Save to Google Maps">
                        <span>🗺️</span> Save to Google Maps
                    </button>
                </div>

                <!-- Map Toggle & Container -->
                <div class="map-section">
                    <button class="map-toggle" id="mapToggle">
                        <span>📍</span> Show Map
                    </button>
                    <div class="map-wrapper" id="mapWrapper">
                        <div id="map" class="map-container"></div>
                    </div>
                </div>

                <!-- Restaurant Cards Grid -->
                <div class="personality-grid" id="foodGrid">
                    <p class="loading-message">Loading restaurants...</p>
                </div>
            </div>
        </section>
    </main>
